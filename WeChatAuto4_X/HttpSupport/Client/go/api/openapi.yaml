openapi: 3.0.4
info:
  description: 💯 <b>安全、快速构建微信 Agent 的开发基座</b> - <b><font color='red'>不注入</font></b>、<b><font
    color='red'>不破解</font></b>、<b><font color='red'>不写一行代码获取微信聊天记录</font></b>，让你<font
    color='red'>快速上线</font>你的微信应用，并<font color='red'>安全发布</font>到用户端！
  title: WECHATAUTO.SDK
  version: v1
servers:
- url: /
security:
- ApiKey: []
tags:
- name: Clients
- name: Conversations
- name: Database
- name: Friends
- name: Groups
- name: Messages
- name: Moments
- name: Navigation
- name: Window
paths:
  /api/v1/clients:
    get:
      operationId: Clients_GetAll
      responses:
        "200":
          description: OK
      summary: 获取全部微信客户端的概要信息列表。
      tags:
      - Clients
  /api/v1/clients/{clientId}:
    get:
      operationId: Clients_GetInfo
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取指定微信客户端的概要信息（昵称、wxid、头像路径、进程ID、窗口句柄、任务栏索引）。
      tags:
      - Clients
  /api/v1/clients/{clientId}/owner-info:
    get:
      operationId: Clients_GetOwnerInfo
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取本微信的个人信息（头像文件位置、wxid、昵称）。
      tags:
      - Clients
  /api/v1/clients/{clientId}/version:
    get:
      operationId: Clients_GetVersion
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取本微信的版本号。
      tags:
      - Clients
  /api/v1/clients/{clientId}/storage-root:
    get:
      operationId: Clients_GetStorageRoot
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 通过界面自动读取微信存储位置（VIP，一般不需要，SDK 会自动读取并缓存）。
      tags:
      - Clients
  /api/v1/clients/{clientId}/avatar:
    post:
      operationId: Clients_SaveAvatar
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAvatarRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/SaveAvatarRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/SaveAvatarRequest"
      responses:
        "200":
          description: OK
      summary: 保存本微信头像到指定路径。
      tags:
      - Clients
  /api/v1/clients/{clientId}/notify-icon/click:
    post:
      operationId: Clients_ClickNotifyIcon
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyIconClickRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/NotifyIconClickRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/NotifyIconClickRequest"
      responses:
        "200":
          description: OK
      summary: 点击任务栏微信图标，按索引或微信名称定位。
      tags:
      - Clients
  /api/v1/clients/{clientId}/conversations:
    get:
      operationId: Conversations_GetAllConversations
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取会话列表所有会话的标题。
      tags:
      - Conversations
  /api/v1/clients/{clientId}/conversations/visible-titles:
    get:
      operationId: Conversations_GetVisibleTitles
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取会话列表可见会话的标题。
      tags:
      - Conversations
  /api/v1/clients/{clientId}/conversations/visible:
    get:
      operationId: Conversations_GetVisibleConversations
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取可见会话列表（含名称、未读消息数、头像等）。
      tags:
      - Conversations
  /api/v1/clients/{clientId}/conversations/search:
    post:
      operationId: Conversations_Search
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchConversationRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/SearchConversationRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/SearchConversationRequest"
      responses:
        "200":
          description: OK
      summary: 搜索好友/群聊。
      tags:
      - Conversations
  /api/v1/clients/{clientId}/conversations/locate:
    post:
      operationId: Conversations_Locate
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocateConversationRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/LocateConversationRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/LocateConversationRequest"
      responses:
        "200":
          description: OK
      summary: 定位会话，滚动会话列表使指定会话可见。
      tags:
      - Conversations
  /api/v1/clients/{clientId}/conversations/set-do-not-disturb:
    post:
      operationId: Conversations_SetDoNotDisturb
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDoNotDisturbRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/SetDoNotDisturbRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/SetDoNotDisturbRequest"
      responses:
        "200":
          description: OK
      summary: 设置会话消息免打扰。
      tags:
      - Conversations
  /api/v1/clients/{clientId}/conversations/set-top-most:
    post:
      operationId: Conversations_SetTopMost
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTopMostRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/SetTopMostRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/SetTopMostRequest"
      responses:
        "200":
          description: OK
      summary: 设置会话置顶。
      tags:
      - Conversations
  /api/v1/clients/{clientId}/database/contacts:
    get:
      operationId: Database_GetContacts
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取当前微信号全部联系人（不含已删除）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/contacts/{userName}:
    get:
      operationId: Database_GetContact
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userName
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 按 username（wxid / 群 id）取一条联系人。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/contacts/search:
    get:
      operationId: Database_SearchContacts
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: keyword
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按关键字模糊搜索联系人（匹配 UserName / NickName / Remark / Alias）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/contacts/by-show-name:
    get:
      operationId: Database_GetContactsByShowName
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: showName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按显示名取联系人；重名时返回多个。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/contacts/by-show-name/first:
    get:
      operationId: Database_GetContactByShowName
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: showName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按显示名取第一条联系人（重名时取 UserName 升序第一条）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/messages:
    get:
      operationId: Database_GetMessages
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: chatUsername
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: count
        required: false
        schema:
          default: 50
          format: int32
          type: integer
        style: form
      responses:
        "200":
          description: OK
      summary: 取指定会话最近 N 条消息（从新到旧）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/messages/recent:
    get:
      operationId: Database_GetRecentMessages
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: chatUsername
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: count
        required: false
        schema:
          default: 50
          format: int32
          type: integer
        style: form
      responses:
        "200":
          description: OK
      summary: 取指定会话最近 N 条消息（从旧到新，适合 LLM 上下文）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/messages/new:
    get:
      operationId: Database_GetNewMessages
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: afterSortSeq
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          description: OK
      summary: 取 SortSeq 大于指定值的新消息（从旧到新）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/messages/max-sort-seq:
    get:
      operationId: Database_GetMaxSortSeq
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 取当前微信号消息的最大 SortSeq（增量水位）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/messages/search:
    get:
      operationId: Database_SearchMessages
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: keyword
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: chatUsername
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按正文关键字搜索当前微信号消息。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/messages/search-all:
    get:
      operationId: Database_SearchAllMessages
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: keyword
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: chatUsername
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按正文关键字跨所有微信号搜索消息。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/rooms:
    get:
      operationId: Database_GetRooms
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 获取当前微信号全部群聊。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/rooms/{roomUsername}/members:
    get:
      operationId: Database_GetRoomMembers
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: roomUsername
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 按群 username 取成员列表。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/rooms/by-show-name:
    get:
      operationId: Database_GetRoomsByShowName
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: showName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按群的显示名取群；重名时返回多个。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/rooms/by-show-name/first:
    get:
      operationId: Database_GetRoomByShowName
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: showName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按群的显示名取第一条群。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/rooms/by-show-name/members:
    get:
      operationId: Database_GetRoomMembersByShowName
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: showName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按群的显示名取成员列表；重名时取第一条群。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/rooms/by-local-type:
    get:
      operationId: Database_GetRoomsByLocalType
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: localType
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          description: OK
      summary: 按联系人 LocalType 过滤群聊（本机观察群多为 2）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/sns/posts:
    get:
      operationId: Database_GetSnsPosts
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        style: form
      responses:
        "200":
          description: OK
      summary: 取最近 N 条朋友圈（含媒体、点赞、评论）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/sns/posts/{tid}:
    get:
      operationId: Database_GetSnsPost
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: tid
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          description: OK
      summary: 按 tid 取一条朋友圈（含媒体、点赞、评论）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/sns/posts/by-date:
    get:
      operationId: Database_GetSnsPostsByDate
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: date
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 取某一天的朋友圈（按中国标准时间 UTC+8 的日历日）。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/sns/posts/by-user:
    get:
      operationId: Database_GetSnsPostsByUserName
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: userName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 取某个发布者（真实 UserName / wxid）的朋友圈。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/sns/posts/by-show-name:
    get:
      operationId: Database_GetSnsPostsByShowName
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: showName
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: 按发布者显示名取朋友圈；重名会一并返回。
      tags:
      - Database
  /api/v1/clients/{clientId}/database/query:
    post:
      operationId: Database_Query
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseQueryRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/DatabaseQueryRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/DatabaseQueryRequest"
      responses:
        "200":
          description: OK
      summary: 执行一条 SELECT 查询（仅查询，不允许写操作；不会自动追加当前微信号条件）。
      tags:
      - Database
  /api/v1/clients/{clientId}/friends/add-window/open:
    post:
      operationId: Friends_OpenAddWindow
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 打开新增朋友窗口。
      tags:
      - Friends
  /api/v1/clients/{clientId}/friends/add-window/close:
    post:
      operationId: Friends_CloseAddWindow
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: 关闭新增朋友窗口。
      tags:
      - Friends
  /api/v1/clients/{clientId}/friends/add:
    post:
      operationId: Friends_Add
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFriendsRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/AddFriendsRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/AddFriendsRequest"
      responses:
        "200":
          description: OK
      summary: 通过手机号码/微信号查找并添加好友。
      tags:
      - Friends
  /api/v1/clients/{clientId}/friends/pass-all:
    post:
      operationId: Friends_PassAll
      parameters:
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassedAllNewFriendRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/PassedAllNewFriendRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/PassedAllNewFriendRequest"
      responses:
