components:
  schemas:
    AddFriendsOptions:
      additionalProperties: false
      description: 增加朋友选项
      example:
        intervalTime: 0
        isCloseWin: true
        sayHi: sayHi
        suffix: suffix
        label: label
      properties:
        intervalTime:
          description: "间隔时间,以秒为单位，默认为三秒，如果担心风控，可以把此时间设置长一点"
          format: int32
          type: integer
        isCloseWin:
          description: "是否关闭增加朋友窗口,默认关闭，可以设置为false不关闭"
          type: boolean
        sayHi:
          description: "加好友时打招呼内容,如果为空，则保持微信默认"
          nullable: true
          type: string
        suffix:
          description: "备注后缀，如：设置suffix为\"test\",则备注为:xxxx_test,可以未来以备注的后缀来区分不同的好友\
            分类"
          nullable: true
          type: string
        label:
          description: 设置标签
          nullable: true
          type: string
      type: object
    AddFriendsRequest:
      additionalProperties: false
      description: 通过手机号码或微信号添加好友。
      example:
        friends:
        - friends
        - friends
        options:
          intervalTime: 0
          isCloseWin: true
          sayHi: sayHi
          suffix: suffix
          label: label
      properties:
        friends:
          items:
            type: string
          nullable: true
          type: array
        options:
          $ref: "#/components/schemas/AddFriendsOptions"
      type: object
    AddGroupMemberToFriendsRequest:
      additionalProperties: false
      description: 从群聊中添加好友。
      example:
        group_name: group_name
        members:
        - members
        - members
        options:
          intervalTime: 0
          isCloseWin: true
          sayHi: sayHi
          suffix: suffix
          label: label
      properties:
        group_name:
          nullable: true
          type: string
        members:
          items:
            type: string
          nullable: true
          type: array
        options:
          $ref: "#/components/schemas/AddFriendsOptions"
      type: object
    AddMomentsRequest:
      additionalProperties: false
      description: 发朋友圈。
      example:
        image_files:
        - image_files
        - image_files
        content: content
        options:
          atUsrs:
          - atUsrs
          - atUsrs
          labels:
          - labels
          - labels
          isCloseMoments: true
      properties:
        image_files:
          items:
            type: string
          nullable: true
          type: array
        content:
          nullable: true
          type: string
        options:
          $ref: "#/components/schemas/MomentsOptions"
      type: object
    ChangeGroupMemoRequest:
      additionalProperties: false
      description: 修改群备注。
      example:
